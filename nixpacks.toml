[providers]
php = { version = "8.2" }
node = { version = "20" }

[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs-20_x"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install"
]

[phases.build]
cmds = [
  "npm run prod"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=8000"
